<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7FFF9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ECFBF3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with gradient -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="90"/>
  
  <!-- Main I Letter with gradient -->
  <text x="256" y="380" font-family="Space Grotesk, Arial, sans-serif" font-size="300" font-weight="bold" text-anchor="middle" fill="url(#iconGradient)">I</text>
  
  <!-- Code brackets -->
  <text x="120" y="360" font-family="monospace" font-size="120" font-weight="bold" text-anchor="middle" fill="#1F2937">&lt;</text>
  <text x="392" y="360" font-family="monospace" font-size="120" font-weight="bold" text-anchor="middle" fill="#1F2937">/&gt;</text>
  
  <!-- Small accent circle -->
  <circle cx="256" cy="100" r="40" fill="#F6B000"/>
</svg>
